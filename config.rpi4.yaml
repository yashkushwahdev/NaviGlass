# Raspberry Pi 4 Model B (8 GB) initial conservative profile.
# This file uses only keys supported by the existing config/settings.py schema.
camera:
  index: 0
  width: 640
  height: 480
  fps: 15
  preview: false
  source: ""
  backend: "auto"
model:
  backend: "onnx"
  model_name: "yolov8n.onnx"
  fallback_model_name: "yolov8n.onnx"
  weights_dir: "models"
  inference_size: 320
  confidence_threshold: 0.45
  iou_threshold: 0.45
  device: "cpu"
  frame_skip: 2
  num_threads: 4
depth:
  enabled: false  # Enable only after depth-model runtime and camera calibration checks.
  model_name: "depth_anything_v2_metric_hypersim_vits.pth"
  weights_dir: "models"
  encoder: "vits"
  dataset: "hypersim"
  max_depth: 20.0
  input_size: 252
  device: "cpu"
  frame_interval: 6
  max_age_seconds: 1.2
  margin_ratio: 0.15
  min_valid_depth: 0.2
  max_valid_depth: 20.0
  min_valid_pixels: 10
  urgent_distance_threshold: 1.0
  caution_distance_threshold: 2.0
  hysteresis_distance_m: 0.25
  significant_distance_delta_m: 0.5
  temporal_smoothing_alpha: 0.35
alert:
  enable_ocr: false
  eligible_classes: [person, chair, bottle, cup, couch, laptop, cell phone, book, dog, cat, car, bicycle, door]
  announcement_interval_seconds: 4.0
  cooldown_seconds: 4.0
  announcement_format: "{class_name} {position}."
  include_position: true
  frame_width: 640
  position:
    enabled: true
    left_threshold: 0.35
    right_threshold: 0.65
    hysteresis: 0.04
    phrase_left: "on your left"
    phrase_center: "in front of you"
    phrase_right: "on your right"
    announce_position_change: true
    position_change_cooldown_seconds: 1.5
    multi_object_announcements: false
    max_multi_objects: 3
audio:
  enabled: true
  speech_rate_wpm: 180
  volume: 1.0
  fallback_to_terminal: true
monitoring:
  fps_window_size: 20
  metrics_report_interval_seconds: 5.0
